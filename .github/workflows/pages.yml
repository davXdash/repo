name: Sheets importieren und Pages veröffentlichen
on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      sheet_links:
        description: 'Weitere Google-Sheets-Links (optional, durch Leerzeichen oder Zeilenumbrüche getrennt)'
        required: false
        type: string
      source_id:
        description: 'Optional: nur eine Quell-ID erneut einlesen'
        required: false
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Galerie, Hauls und Synchronisierung prüfen
        run: |
          node --check dist/app.js
          node --check dist/sync.js
          node tools/test_catalog_model.cjs
          node tools/test_sync.cjs
          node tools/test_sync_integration.cjs
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Repair image cache')
        with:
          python-version: '3.12'
      - name: Import-Abhängigkeiten installieren
        if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Repair image cache')
        run: pip install -r tools/requirements.txt
      - name: Importer prüfen
        if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Repair image cache')
        run: |
          python tools/test_import_sheets.py
          python tools/test_import_trellox.py
      - name: Modell und Bildcache prüfen
        if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Repair image cache')
        run: |
          python tools/test_catalog_media.py
          node tools/test_catalog_model.cjs
      - name: Sheets importieren
        if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Repair image cache')
        env:
          SHEET_LINKS: ${{ inputs.sheet_links }}
          ONLY_SOURCE: ${{ inputs.source_id || (contains(github.event.head_commit.message, 'Trellox source') && 'trellox') || (contains(github.event.head_commit.message, 'W2C product names') && '14') || (contains(github.event.head_commit.message, 'Jfinds watch images') && '9') || '' }}
        run: python tools/import_sheets.py --links "$SHEET_LINKS" --only-source "$ONLY_SOURCE"
      - name: Aktuellen Importbericht anzeigen
        if: always()
        run: cat dist/imports/index.json
      - name: Aktualisierte Sammlung speichern
        if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Repair image cache')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/imports sources.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update imported catalog and source reports'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
